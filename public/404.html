<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>擺寶庫迷你倉 | BBK Mini Storage</title>
    <script type="text/javascript">
      // Redirect to index.html with the target path in the query string
      var locationInfo = window.location;
      var redirectUrl = locationInfo.protocol + '//' + locationInfo.hostname + (locationInfo.port ? ':' + locationInfo.port : '') + '/';
      
      // Extract the path after domain
      var path = locationInfo.pathname;
      var query = locationInfo.search;
      var hash = locationInfo.hash;
      
      // For GitHub Pages under custom domain or raw repository path
      // If we are under a subfolder (e.g. /repo-name/), we shouldn't lose it if applicable,
      // but since the customer uses a custom domain (bbkstorage.com.tw), path will start with '/'
      // Carry the target path in the 'redirect' parameter
      window.location.replace(redirectUrl + '?redirect=' + encodeURIComponent(path + query + hash));
    </script>
  </head>
  <body>
  </body>
</html>
